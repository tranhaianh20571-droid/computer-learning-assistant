<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>调试检查</title>
<style>
body { font-family: monospace; padding: 20px; background: #0a0d12; color: #e8eaec; }
.pass { color: #4ade80; }
.fail { color: #f87171; }
pre { background: #161d2b; padding: 12px; border-radius: 4px; overflow: auto; }
</style>
</head>
<body>
<h1>学伴应用诊断</h1>
<div id="results"></div>
<script>
const results = [];
function test(name, fn) {
  try {
    const result = fn();
    results.push(`<div class="pass">✓ ${name}: ${result || 'OK'}</div>`);
  } catch (e) {
    results.push(`<div class="fail">✗ ${name}: ${e.message}</div>`);
    console.error(name, e);
  }
}

// 加载主应用
const iframe = document.createElement('iframe');
iframe.style.display = 'none';
iframe.src = 'index.html#/settings/models';
document.body.appendChild(iframe);

iframe.onload = function() {
  const win = iframe.contentWindow;

  test('Window.App 存在', () => win.App ? 'YES' : 'NO');
  test('App.S 存在', () => win.App && win.App.S ? 'YES' : 'NO');
  test('路由已注册', () => {
    if (!win.App) return 'App未定义';
    const routes = Object.keys(win.App.routes || {});
    return routes.length + ' 个路由';
  });
  test('App元素存在', () => {
    const app = iframe.contentDocument.getElementById('app');
    return app ? `innerHTML长度: ${app.innerHTML.length}` : 'app元素不存在';
  });
  test('App内容', () => {
    const app = iframe.contentDocument.getElementById('app');
    if (!app || !app.innerHTML) return '内容为空';
    return app.innerHTML.substring(0, 100);
  });
  test('控制台错误', () => {
    // 检查是否有JS错误
    return '需要手动检查浏览器控制台';
  });

  setTimeout(() => {
    document.getElementById('results').innerHTML = results.join('\n');

    // 显示完整的app内容
    const app = iframe.contentDocument.getElementById('app');
    if (app) {
      const pre = document.createElement('pre');
      pre.textContent = 'App元素内容:\n' + (app.innerHTML || '(空)');
      document.getElementById('results').appendChild(pre);
    }
  }, 500);
};

iframe.onerror = function(e) {
  results.push(`<div class="fail">✗ iframe加载失败: ${e}</div>`);
  document.getElementById('results').innerHTML = results.join('\n');
};
</script>
</body>
</html>
