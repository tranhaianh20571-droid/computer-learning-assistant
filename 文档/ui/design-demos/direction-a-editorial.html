<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>学伴 · 计算机领域学习空间</title>
<style>
/* OD-LAYOUT-PRIMITIVES v1 — structure only: display, flex/grid, overflow, wrapping, ratio.
   Put this @layer first; product CSS outside the layer always wins. */
@layer od-layout {
  :where(.od-stack,.od-row,.od-row-top,.od-cluster,.od-grid,.od-field,.od-stat,.od-cell,.od-tile) > :where(*) { min-width: 0; }
  .od-stack   { display: flex; flex-direction: column; gap: var(--od-gap, 8px); }
  .od-row     { display: flex; align-items: center; gap: var(--od-gap, 8px); }
  .od-row-top { display: flex; align-items: flex-start; gap: var(--od-gap, 8px); }
  .od-cluster { display: flex; flex-wrap: wrap; align-items: center; gap: var(--od-gap, 8px); }
  .od-fill    { flex: 1 1 0; min-width: 0; }
  .od-fixed   { flex: none; }
  .od-grid    { display: grid; gap: var(--od-gap, 12px); grid-template-columns: repeat(var(--od-cols, 3), minmax(0, 1fr)); }
  .od-stat, .od-field, .od-cell { display: grid; gap: var(--od-gap, 2px); }
  :where(.od-stat,.od-field,.od-cell) > :where(*) { display: block; }
  .od-tile { display: grid; grid-template-rows: auto 1fr; }
  :where(.od-tile) > :where(*) { display: block; }
  .od-media { display: block; width: 100%; height: auto; aspect-ratio: var(--od-ratio, auto); }
  .od-media-cover { object-fit: cover; }
  .od-truncate { display: block; max-width: 100%; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  .od-clamp-2, .od-clamp-3 { display: -webkit-box; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: anywhere; }
  .od-clamp-2 { -webkit-line-clamp: 2; }
  .od-clamp-3 { -webkit-line-clamp: 3; }
  .od-lines-2 { min-height: calc(2 * 1.4em); }
  .od-nowrap  { white-space: nowrap; }
  .od-keep    { word-break: keep-all; overflow-wrap: anywhere; }
  .od-screen { display: grid; grid-template-rows: auto minmax(0, 1fr) auto; height: 100%; }
  .od-scroll { overflow-y: auto; overscroll-behavior: contain; min-height: 0; }
  .od-rail { display: flex; gap: var(--od-gap, 8px); overflow-x: auto; scroll-snap-type: x proximity; scrollbar-width: none;
             padding-inline: var(--od-rail-pad, 16px); scroll-padding-inline: var(--od-rail-pad, 16px); }
  .od-rail::-webkit-scrollbar { display: none; }
  :where(.od-rail) > :where(*) { flex: none; scroll-snap-align: start; }
  :where(.od-rail) > :where(:last-child) { margin-inline-end: var(--od-rail-pad, 16px); }
  .od-spacer { flex: none; visibility: hidden; pointer-events: none; }
  .od-touch  { min-width: 44px; min-height: 44px; }
}
/* /OD-LAYOUT-PRIMITIVES v1 */

/* ============ Design Spec ds-1 · 工程制图 / 技术手册 ============ */
:root{
  --ground:#F5F6F4; --surface:#FFFFFF; --sunk:#ECEEEC; --sunk2:#E3E6E4;
  --ink:#15171A; --ink2:#454B53; --ink3:#6A717B;
  --rule:#D9DCDF; --rule2:#BFC4C9;
  --nav:#15171B; --nav2:#1E2126; --nav-ink:#ECEEF0; --nav-dim:#A3AAB3; --nav-rule:#30343B;
  --accent:#2346C8; --accent-ink:#FFFFFF; --accent-w:#E9EDFA; --accent-2:#1A379F;
  --draft:#A8520A; --draft-w:#FBF1E6; --draft-line:#D08A45;
  --ok:#1E7248; --ok-w:#E7F3EC;
  --partial:#8F5A00; --partial-w:#FAF1DF;
  --err:#B42318; --err-w:#FCEDEB;
  --board:#FCFCFB; --board-grid:#E9ECEA;

  --serif:"Noto Serif SC","Source Han Serif SC","Source Han Serif CN","Songti SC","STSong",serif;
  --sans:"PingFang SC","HarmonyOS Sans SC","Microsoft YaHei UI","Microsoft YaHei","Noto Sans SC",system-ui,sans-serif;
  --mono:"JetBrains Mono","Cascadia Mono","SF Mono",Consolas,"Liberation Mono",monospace;

  --t-meta:12px; --t-s:14px; --t-b:16px; --t-l:18px; --t-h3:20px; --t-h2:24px; --t-h1:32px; --t-d:44px;
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:24px; --s6:32px; --s7:48px; --s8:64px;
  --r1:2px; --r2:4px;
  --d-fast:150ms; --d-mid:220ms; --d-slow:300ms;
  --ease-out:cubic-bezier(.2,.7,.2,1); --ease-in:cubic-bezier(.5,0,.8,.3);
  --hatch:repeating-linear-gradient(135deg, rgba(168,82,10,.13) 0 2px, transparent 2px 8px);
  --side:236px; --top:56px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--ground);color:var(--ink);font:var(--t-b)/1.6 var(--sans);-webkit-font-smoothing:antialiased;min-width:360px}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
img{max-width:100%}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
::selection{background:#C9D3F5}
.sr{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.serif{font-family:var(--serif)}
.mono{font-family:var(--mono)}
.muted{color:var(--ink2)}
.faint{color:var(--ink3)}
.meta{font:500 var(--t-meta)/1.4 var(--mono);letter-spacing:.04em;color:var(--ink3)}
.kicker{font:600 var(--t-meta)/1.4 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--ink3)}
.h-d{font:600 var(--t-d)/1.18 var(--serif);letter-spacing:-.005em}
.h1{font:600 var(--t-h1)/1.25 var(--serif)}
.h2{font:600 var(--t-h2)/1.3 var(--serif)}
.h3{font:600 var(--t-h3)/1.35 var(--serif)}
.h4{font:600 var(--t-b)/1.4 var(--sans)}
.lede{font-size:var(--t-l);color:var(--ink2);max-width:60ch;line-height:1.65}
.prose{max-width:68ch}
.prose p+p{margin-top:var(--s3)}
code,kbd,.code{font-family:var(--mono);font-size:.9em}
kbd{border:1px solid var(--rule2);border-bottom-width:2px;border-radius:var(--r1);padding:0 5px;background:var(--surface);font-size:12px}
hr.rule{border:0;border-top:1px solid var(--rule)}

/* ---------- 按钮 ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:var(--s2);min-height:40px;padding:0 var(--s4);border:1px solid var(--rule2);background:var(--surface);border-radius:var(--r2);font-size:var(--t-s);font-weight:500;cursor:pointer;white-space:nowrap;text-decoration:none;color:var(--ink);transition:background var(--d-fast) var(--ease-out),border-color var(--d-fast)}
.btn svg{width:16px;height:16px;flex:none}
.btn-pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn-ink{background:var(--ink);border-color:var(--ink);color:#fff}
.btn-quiet{border-color:transparent;background:transparent;padding:0 var(--s2)}
.btn-danger{color:var(--err);border-color:#E3B5AF}
.btn-draft{color:var(--draft);border-color:var(--draft-line);border-style:dashed;background:var(--surface)}
.btn-sm{min-height:32px;padding:0 var(--s3);font-size:13px}
.btn[disabled],.btn[aria-disabled="true"]{cursor:not-allowed;background:var(--sunk);border-color:var(--rule);color:var(--ink3)}
@media (hover:hover){
  .btn:hover:not([disabled]){border-color:var(--ink2)}
  .btn-pri:hover:not([disabled]){background:var(--accent-2);border-color:var(--accent-2)}
  .btn-ink:hover:not([disabled]){background:#000}
  .btn-quiet:hover:not([disabled]){background:var(--sunk);border-color:transparent}
  .btn-danger:hover:not([disabled]){background:var(--err-w);border-color:var(--err)}
}
.linkbtn{background:none;border:0;padding:0;color:var(--accent);cursor:pointer;text-decoration:underline;text-underline-offset:3px;font-size:inherit}
.iconbtn{display:inline-grid;place-items:center;width:40px;height:40px;border:1px solid transparent;background:transparent;border-radius:var(--r2);cursor:pointer;color:var(--ink2)}
.iconbtn svg{width:18px;height:18px}
@media (hover:hover){.iconbtn:hover{background:var(--sunk);color:var(--ink)}}
.iconbtn[aria-pressed="true"]{background:var(--ink);color:#fff}

/* ---------- 表单 ---------- */
.field{display:grid;gap:8px;margin-bottom:4px}
.field>label,.lbl{font-size:var(--t-s);font-weight:600;color:var(--ink)}
.lbl .req{color:var(--err);font-weight:500;margin-left:4px;font-size:12px}
.help{font-size:13px;color:var(--ink2);line-height:1.55;margin-top:2px}
.inp,.sel,.ta{width:100%;min-height:44px;padding:11px 14px;border:1px solid var(--rule2);background:var(--surface);border-radius:var(--r2);font-size:var(--t-b);transition:border-color var(--d-fast),box-shadow var(--d-fast)}
.ta{min-height:112px;resize:vertical;line-height:1.6}
.inp:focus,.sel:focus,.ta:focus{border-color:var(--accent);outline:2px solid var(--accent-w);outline-offset:0;box-shadow:0 0 0 3px var(--accent-w)}
.inp[aria-invalid="true"],.ta[aria-invalid="true"]{border-color:var(--err)}
.ferr{display:flex;gap:6px;align-items:flex-start;font-size:13px;color:var(--err);line-height:1.5}
.ferr svg{width:14px;height:14px;flex:none;margin-top:3px}
.seg{display:inline-flex;border:1px solid var(--rule2);border-radius:var(--r2);background:var(--surface);padding:2px;gap:2px;flex-wrap:wrap}
.seg button{min-height:36px;padding:0 var(--s3);border:0;background:transparent;border-radius:var(--r1);cursor:pointer;font-size:var(--t-s);color:var(--ink2);white-space:nowrap}
.seg button[aria-pressed="true"],.seg button[aria-checked="true"]{background:var(--ink);color:#fff}
@media (hover:hover){.seg button:hover:not([aria-pressed="true"]):not([aria-checked="true"]){background:var(--sunk);color:var(--ink)}}
.od-cluster{display:flex;flex-wrap:wrap;gap:var(--s3);align-items:center;margin-top:var(--s5)}
@media (max-width:640px){.od-cluster{flex-direction:column;align-items:stretch}.od-cluster .btn{width:100%}}
.chk{display:flex;gap:10px;align-items:flex-start;cursor:pointer;font-size:var(--t-s)}
.chk input{width:18px;height:18px;margin-top:2px;accent-color:var(--accent);flex:none}
.radio-list{display:grid;gap:var(--s2)}
.radio-row{display:flex;gap:var(--s3);align-items:flex-start;padding:var(--s3) var(--s4);border:1px solid var(--rule);border-radius:var(--r2);cursor:pointer;background:var(--surface);transition:all var(--d-fast)}
.radio-row input{margin-top:4px;accent-color:var(--accent);width:18px;height:18px;flex:none}
.radio-row > span{flex:1;min-width:0}
.radio-row b{display:block;font-weight:600;margin-bottom:4px}
.radio-row .help{margin-top:4px}
.radio-row:has(input:checked){border-color:var(--ink);background:var(--ground);box-shadow:0 0 0 1px var(--ink)}
@media (hover:hover){.radio-row:hover{border-color:var(--ink2)}}

/* ---------- 三层状态字形 ---------- */
.st{display:inline-flex;align-items:center;gap:6px;font-size:13px;line-height:1.3;color:var(--ink2);white-space:nowrap}
.st .k{font:500 11px/1 var(--mono);letter-spacing:.06em;color:var(--ink3)}
.st .g{width:10px;height:10px;flex:none;position:relative;display:inline-block}
/* 资料：方块 */
.st-mat .g{border:1.5px solid var(--ink3)}
.st-mat.is-parsing .g{border-color:var(--accent);background:linear-gradient(90deg,var(--accent) 50%,transparent 50%)}
.st-mat.is-ok .g{border-color:var(--ok);background:var(--ok)}
.st-mat.is-partial .g{border-color:var(--partial);background:linear-gradient(135deg,var(--partial) 50%,transparent 50%)}
.st-mat.is-fail .g{border-color:var(--err);background:
  linear-gradient(45deg,transparent 42%,var(--err) 42% 58%,transparent 58%),linear-gradient(-45deg,transparent 42%,var(--err) 42% 58%,transparent 58%)}
.st-mat.is-gone .g{border-style:dashed}
.st-mat.is-ok{color:var(--ok)} .st-mat.is-partial{color:var(--partial)} .st-mat.is-fail{color:var(--err)}
/* 讲解准备：菱形 */
.st-prep .g{width:9px;height:9px;transform:rotate(45deg);border:1.5px solid var(--ink3);margin:0 1px}
.st-prep.is-making .g{border-color:var(--accent);animation:spin 1.6s linear infinite}
.st-prep.is-ready .g{background:var(--ink);border-color:var(--ink)}
.st-prep.is-fail .g{border-color:var(--err);background:var(--err-w)}
.st-prep.is-fail{color:var(--err)}
.st-prep.is-ready{color:var(--ink)}
/* 学习：圆点 */
.st-learn .g{border-radius:50%;border:1.5px solid var(--ink3)}
.st-learn.is-doing .g{border-color:var(--accent);background:linear-gradient(90deg,var(--accent) 50%,transparent 50%)}
.st-learn.is-done .g{border-color:var(--accent);background:var(--accent)}
.st-learn.is-doing,.st-learn.is-done{color:var(--accent)}
.st-learn.is-done{font-weight:600}
@keyframes spin{to{transform:rotate(405deg)}}
.states{display:flex;flex-wrap:wrap;gap:6px 18px}

/* ---------- 版本：草稿 vs 已确认 ---------- */
.ver{display:inline-flex;align-items:center;gap:8px;min-height:28px;padding:0 10px;font:600 12px/1 var(--mono);letter-spacing:.04em;border-radius:var(--r1);white-space:nowrap}
.ver-draft{color:var(--draft);border:1.5px dashed var(--draft-line);background:var(--surface) var(--hatch)}
.ver-conf{color:var(--ink);border:1.5px solid var(--ink);box-shadow:inset 0 0 0 2px var(--surface),inset 0 0 0 3px var(--ink)}
.ver-hist{color:var(--ink3);border:1px solid var(--rule2)}
.ver-cand{color:var(--accent);border:1.5px dotted var(--accent);background:var(--accent-w)}
.draft-surface{background:var(--surface) var(--hatch);border:1.5px dashed var(--draft-line)}

/* ---------- 提示条（不使用左色条） ---------- */
.note{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px var(--s3);padding:var(--s3) var(--s4);border:1px solid var(--rule2);background:var(--surface);border-radius:var(--r2);font-size:var(--t-s);line-height:1.6}
.note .tag{grid-row:span 2;font:700 11px/1 var(--mono);letter-spacing:.08em;padding:5px 7px;border:1px solid currentColor;border-radius:var(--r1);align-self:start;margin-top:2px;white-space:nowrap}
.note .tt{font-weight:600;color:var(--ink)}
.note .acts{grid-column:2;display:flex;flex-wrap:wrap;gap:var(--s2);margin-top:var(--s2)}
.note-warn{background:var(--partial-w);border-color:#E3C68F}.note-warn .tag{color:var(--partial)}
.note-err{background:var(--err-w);border-color:#E9B3AC}.note-err .tag{color:var(--err)}
.note-ok{background:var(--ok-w);border-color:#B5D8C3}.note-ok .tag{color:var(--ok)}
.note-info .tag{color:var(--ink2)}
.note-accent{background:var(--accent-w);border-color:#BCC8F0}.note-accent .tag{color:var(--accent)}
.note-draft{background:var(--surface) var(--hatch);border:1.5px dashed var(--draft-line)}.note-draft .tag{color:var(--draft)}
.note-dark{background:var(--ink);border-color:var(--ink);color:#E6E8EA}.note-dark .tt{color:#fff}.note-dark .tag{color:#fff}

/* ---------- 应用骨架 ---------- */
.app{display:grid;grid-template-columns:var(--side) minmax(0,1fr);height:100vh;min-height:0;overflow:hidden}
.side{background:var(--nav);color:var(--nav-ink);position:sticky;top:0;height:100vh;display:flex;flex-direction:column;overflow-y:auto}
.brand{display:flex;align-items:baseline;gap:10px;padding:22px 20px 18px}
.brand .wm{font:700 22px/1 var(--serif);letter-spacing:.08em;color:#fff}
.brand .sub{font:500 11px/1 var(--mono);letter-spacing:.12em;color:var(--nav-dim)}
.nav-g{padding:14px 12px 4px}
.nav-g .gl{font:600 11px/1 var(--mono);letter-spacing:.14em;color:var(--nav-dim);padding:0 8px 8px;text-transform:uppercase}
.nav-a{display:flex;align-items:center;gap:10px;min-height:38px;padding:0 8px;border-radius:var(--r2);color:#C9CED5;text-decoration:none;font-size:var(--t-s);position:relative}
.nav-a svg{width:16px;height:16px;flex:none;opacity:.8}
.nav-a .cnt{margin-left:auto;font:500 11px/1 var(--mono);color:var(--nav-dim)}
.nav-a[aria-current="page"]{background:var(--nav2);color:#fff}
.nav-a[aria-current="page"]::before{content:"";position:absolute;left:-12px;top:9px;bottom:9px;width:3px;background:var(--accent)}
@media (hover:hover){.nav-a:hover{background:var(--nav2);color:#fff}}
.nav-a:focus-visible{outline-color:#8EA4F0}
.side-foot{margin-top:auto;padding:16px 20px 20px;border-top:1px solid var(--nav-rule);font-size:13px;color:var(--nav-dim);display:grid;gap:4px}
.side-foot .who{color:var(--nav-ink);font-family:var(--mono);font-size:12px}
.side-foot a{color:#C9CED5}
.side-foot.side-settings-foot{display:flex;justify-content:flex-start;padding:12px 16px 16px}
.side-settings{display:inline-grid;place-items:center;width:40px;height:40px;border:1px solid transparent;border-radius:var(--r2);color:var(--nav-dim);text-decoration:none}
.side-settings svg{width:21px;height:21px}
@media (hover:hover){.side-settings:hover{background:var(--nav2);color:#fff}}

/* ---------- 设置布局 ---------- */
.app.settings-page{display:flex;flex-direction:column}
.settings-layout{display:grid;grid-template-columns:240px minmax(0,1fr);height:calc(100vh - var(--top));min-height:0;flex:1;overflow:hidden}
.settings-nav{background:var(--nav);border-right:1px solid var(--nav-rule);padding:var(--s4) 0;overflow-y:auto}
.settings-nav-item{display:flex;align-items:center;gap:10px;min-height:42px;padding:0 var(--s4);color:var(--nav-dim);text-decoration:none;font-size:var(--t-s);position:relative;transition:background var(--d-fast),color var(--d-fast)}
.settings-nav-item svg{width:18px;height:18px;flex:none;opacity:.8}
.settings-nav-item[aria-current="page"]{background:var(--nav2);color:#fff}
.settings-nav-item[aria-current="page"]::before{content:"";position:absolute;left:0;top:8px;bottom:8px;width:3px;background:var(--accent)}
@media (hover:hover){.settings-nav-item:hover{background:var(--nav2);color:#fff}}
.settings-content{background:var(--ground);overflow-y:auto;overflow-x:hidden;min-height:0;min-width:0}
.settings-content > .page{display:block;width:100%;height:auto;padding:var(--s6) var(--s6) var(--s8);color:var(--ink)} .settings-content .page-w{max-width:920px;margin:0 auto}
@media (max-width:1023px){
  .settings-layout{grid-template-columns:1fr;grid-template-rows:auto minmax(0,1fr)}
  .settings-nav{display:flex;gap:4px;padding:8px 12px;overflow-x:auto;overflow-y:hidden;border-right:0;border-bottom:1px solid var(--nav-rule)}
  .settings-nav-item{min-height:40px;padding:0 12px;white-space:nowrap;border-radius:var(--r2)}
  .settings-nav-item[aria-current="page"]::before{left:8px;right:8px;top:auto;bottom:0;width:auto;height:3px}
}
.main{min-width:0;min-height:0;height:100vh;display:flex;flex-direction:column;overflow:hidden}
.top{position:sticky;top:0;z-index:20;height:var(--top);display:flex;align-items:center;gap:var(--s4);padding:0 var(--s6);background:rgba(245,246,244,.96);border-bottom:1px solid var(--rule)}
.crumb{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink2);min-width:0;flex:1}
.crumb a{color:var(--ink2);text-decoration:none}
.crumb a:hover{color:var(--ink);text-decoration:underline}
.crumb .sep{color:var(--rule2)}
.crumb .here{color:var(--ink);font-weight:600}
.menu-btn{display:none}
.page{padding:var(--s6) var(--s6) var(--s8);min-width:0;min-height:0;flex:1;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain}
.page-w{max-width:1280px}
.phead{display:grid;gap:var(--s2);margin-bottom:var(--s6)}
.phead .row{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:var(--s4)}

/* 保存状态指示 */
.save{display:inline-flex;align-items:center;gap:8px;font-size:13px;white-space:nowrap;min-height:32px;padding:0 10px;border-radius:var(--r2)}
.save .dot{width:8px;height:8px;border-radius:50%;background:var(--ok)}
.save.is-saving .dot{background:transparent;border:2px solid var(--accent);border-right-color:transparent;animation:spin2 .8s linear infinite}
.save.is-failed{background:var(--err);color:#fff;font-weight:600}
.save.is-failed .dot{background:#fff}
.save.is-offline{background:var(--partial-w);color:var(--partial);border:1px solid #E3C68F}
.save.is-offline .dot{background:var(--partial)}
@keyframes spin2{to{transform:rotate(360deg)}}

/* 表格 */
.tbl{width:100%;border-collapse:collapse;font-size:var(--t-s)}
.tbl th{text-align:left;font:600 11px/1.3 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ink3);padding:10px 12px;border-bottom:1px solid var(--ink)}
.tbl td{padding:12px;border-bottom:1px solid var(--rule);vertical-align:top}
.tbl tr.sel td{background:var(--accent-w)}
.tbl tr[data-act]{cursor:pointer}

<script>/* 学伴 · 原型核心：状态、路由、骨架、公共组件 */
(function () {

    shield: 'M12 3.5l7.5 3v5.5c0 4.5-3.2 7.6-7.5 9-4.3-1.4-7.5-4.5-7.5-9V6.5z',

    mail: 'M4 6h16v12H4zM4 7l8 6 8-6',
    img: 'M4.5 5h15v14h-15zM4.5 16l4.5-4.5 4 4 2.5-2.5 4 4M15.5 9.5h.5',
    refresh: 'M19.5 12a7.5 7.5 0 11-2.2-5.3M19.5 4.5v4h-4',
    offline: 'M3 3l18 18M8.5 16.5a5 5 0 017 0M5 13a10 10 0 015-2.6M14.5 10.6A10 10 0 0119 13M2 9.5a15 15 0 014.5-2.8M11 6a15 15 0 0111 3.5',
    dots: 'M6 12h.5M12 12h.5M18 12h.5',
    flag: 'M5.5 20.5V4.5M5.5 5h11l-2 3.5 2 3.5h-11',

  };
  App.ic = function (name, cls) {
    return '<svg class="' + (cls || '') + '" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="' + (P[name] || '') + '"/></svg>';
  };

  /* ---------------- 三层状态 ---------------- */
  var ST = {
    mat: { none: '未就绪', parsing: '解析中', ok: '可用', partial: '部分可用', fail: '失败', gone: '不可用 · 已删除' },
    prep: { none: '未生成', making: '生成中', ready: '已就绪', fail: '失败' },
    learn: { none: '未开始', doing: '学习中', done: '用户确认完成' }
  };
  var STK = { mat: '资料', prep: '讲解', learn: '学习' };
  App.st = function (kind, val, extra) {
    return '<span class="st st-' + kind + ' is-' + val + '"><i class="g" aria-hidden="true"></i><span class="k">' + STK[kind] + '</span>' +
      (extra || ST[kind][val]) + '</span>';
  };
  App.ver = function (type, text) {
    return '<span class="ver ver-' + type + '">' + text + '</span>';
  };
  App.note = function (kind, tag, title, body, acts) {
    return '<div class="note note-' + kind + '" role="' + (kind === 'err' ? 'alert' : 'note') + '"><span class="tag">' + tag + '</span>' +
      '<div class="tt">' + title + '</div><div>' + (body || '') + '</div>' + (acts ? '<div class="acts">' + acts + '</div>' : '') + '</div>';
  };

  /* ---------------- 自动保存状态机 ---------------- */
  var saveTimer = null, saveReq = null;
  App.saveHTML = function (what) {
    var s = S.save, w = what || '草稿';
    if (s.state === 'dirty') return '<span class="save" data-save><span class="dot" style="background:var(--draft)"></span>有修改 · 停止编辑 1 秒后保存</span>';
    if (s.state === 'saving') return '<span class="save is-saving" data-save><span class="dot"></span>正在保存' + w + '…</span>';
    if (s.state === 'failed') return '<span class="save is-failed" data-save role="alert"><span class="dot"></span>' + w + '未保存 · 服务端未确认 · 上次成功 ' + s.lastOk +
      ' <button class="btn btn-sm" style="min-height:24px;margin-left:6px;color:var(--err)" data-act="save-retry">重试</button></span>';
    if (s.state === 'offline') return '<span class="save is-offline" data-save role="alert"><span class="dot"></span>离线 · 修改只在本页，未保存 · 上次成功 ' + s.lastOk + '</span>';
    return '<span class="save" data-save><span class="dot"></span>' + w + '已保存 ' + s.at + ' · 服务端已确认</span>';
  };
  function paintSave() {
    App.$$('[data-save]').forEach(function (el) { el.outerHTML = App.saveHTML(el.getAttribute('data-save-what') || undefined); });
    App.$$('[data-save-dep]').forEach(function (el) { if (App.onSavePaint) App.onSavePaint(el); });
  }
  App.save = {
    touch: function () {
      S.save.state = 'dirty'; paintSave();
      clearTimeout(saveTimer);
      saveTimer = setTimeout(App.save.flush, 1000);
    },
    flush: function () {
      clearTimeout(saveReq);
      S.save.state = 'saving'; paintSave();
      saveReq = setTimeout(function () {
        var r = S.review.saveResult;
        if (r === 'ok') { S.save.state = 'saved'; S.save.at = S.save.lastOk = App.clock(); }
        else S.save.state = r === 'offline' ? 'offline' : 'failed';
        paintSave();
      }, 700);
    }
  };

  /* ---------------- 对话框 / toast ---------------- */
  var dlg;
  App.dialog = function (html, onMount) {
    dlg = dlg || document.getElementById('dlg');
    dlg.innerHTML = html;
    if (!dlg.open) dlg.showModal();
    if (onMount) onMount(dlg);
    var f = dlg.querySelector('[autofocus]') || dlg.querySelector('button, input, select, textarea');
    if (f) f.focus();
  };
  App.closeDialog = function () { if (dlg && dlg.open) dlg.close(); };
  App.dlgShell = function (kicker, title, body, foot) {
    return '<div class="dlg-h"><span class="kicker">' + kicker + '</span><h2 class="h3" id="dlg-title">' + title + '</h2></div>' +

  };
  App.toast = function (msg, err) {
    var box = document.getElementById('toasts');
    var t = document.createElement('div');
    t.className = 'toast' + (err ? ' err' : '');
    t.textContent = msg;
    box.appendChild(t);
    setTimeout(function () { t.remove(); }, 3200);
  };

  /* ---------------- 路由 ---------------- */
  var routes = {}, cleanups = [], lastPath = null;
  App.route = function (path, def) { routes[path] = def; };
  App.onLeave = function (fn) { cleanups.push(fn); };
  App.go = function (path) { if (location.hash === '#' + path) render(); else location.hash = path; };
  App.act = {};

  var NAV = [
    { g: '开始', items: [['/home', '新的学习任务', 'plus']] },
    { g: '学习', items: [['/course', '课程', 'book'], ['/lecture', '当前讲次', 'play']] },
    { g: '管理员', items: [['/admin', '注册审批', 'shield', '3'], ['/admin/cloud', '云能力配置', 'cloud']] }
  ];
  App.NAV = NAV;

  function shell(path, def, body) {
    var nav = NAV.map(function (grp) {
      return '<div class="nav-g"><div class="gl">' + grp.g + '</div>' + grp.items.map(function (it) {
        var cur = path === it[0] || (def.nav === it[0]);
        return '<a class="nav-a" href="#' + it[0] + '"' + (cur ? ' aria-current="page"' : '') + '>' + App.ic(it[2]) + '<span>' + it[1] + '</span>' +
          (it[3] ? '<span class="cnt">' + it[3] + '</span>' : '') + '</a>';
      }).join('') + '</div>';
    }).join('');
    var crumb = (def.crumb || []).map(function (c, i, a) {
      var last = i === a.length - 1;
      var cls = (i < a.length - 2 ? ' class="far"' : '');
      return (i ? '<span class="sep' + (i < a.length - 1 ? ' far' : '') + '" aria-hidden="true">/</span>' : '') +
        (last ? '<span class="here">' + c[0] + '</span>' : '<a' + cls + ' href="#' + c[1] + '">' + c[0] + '</a>');
    }).join('');

    // 检测是否在设置页面
    var isSettingsPage = path.startsWith('/settings/');

    if (isSettingsPage) {
      // 设置页面：只有顶栏 + settings-layout，不使用标准的.main结构
      return '<div class="app settings-page"><header class="top"><nav class="crumb" aria-label="当前位置">' + crumb + '</nav></header>' + body + '</div>';
    }

    return '<div class="app">' +
      '<nav class="side" id="side" aria-label="主导航"><div class="brand"><span class="wm">学伴</span><span class="sub">CS · STUDY</span></div>' + nav +
      '<div class="side-foot side-settings-foot"><a class="side-settings" href="#/settings/models" aria-label="打开设置" title="设置">' + App.ic('key') + '</a></div></nav>' +
      '<div class="main"><header class="top"><button class="iconbtn menu-btn" data-act="nav-open" aria-label="打开导航" aria-controls="side">' + App.ic('menu') + '</button>' +
      '<nav class="crumb" aria-label="当前位置">' + crumb + '</nav>' +
      (def.save ? '<span class="hide-s">' + App.saveHTML(def.saveWhat) + '</span>' : '') + '</header>' +
      '<main class="page" id="page">' + body + '</main></div></div>';
  }

  function render() {
    cleanups.splice(0).forEach(function (f) { try { f(); } catch (e) {} });
    var path = (location.hash || '#/home').slice(1) || '/home';
    var def = routes[path] || routes['/home'];
    var body = def.render();
    var root = document.getElementById('app');
    root.innerHTML = def.bare ? body : shell(path, def, body);
    document.title = (def.title || '学伴') + ' · 学伴';
    // 只在换页时回到顶部；同页内重绘保持滚动位置
    if (path !== lastPath) window.scrollTo(0, 0);
    lastPath = path;
    if (def.mount) def.mount(root);
  }
  App.render = render;

  /* 全局事件委托 */
  document.addEventListener('click', function (e) {
    var el = e.target.closest('[data-act]');
    if (!el) return;
    var fn = App.act[el.getAttribute('data-act')];
    if (fn) { fn(el, e); }
  });
  App.act['nav-open'] = function () {
    var s = document.getElementById('side'); s.classList.add('open');
    var first = s.querySelector('a'); if (first) first.focus();
  };
  document.addEventListener('click', function (e) {
    var s = document.getElementById('side');
    if (s && s.classList.contains('open') && !e.target.closest('#side') && !e.target.closest('[data-act="nav-open"]')) s.classList.remove('open');
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') { var s = document.getElementById('side'); if (s) s.classList.remove('open'); }
  });
  App.act['save-retry'] = function () { App.save.flush(); };
  App.act['dlg-close'] = function () { App.closeDialog(); };
  App.act['logout'] = function (el, e) {
    e.preventDefault();
    App.dialog(App.dlgShell('退出登录', '结束这次访问？',
      '<p>退出后，这台电脑上的浏览器会清除缓存的学习内容：讲解文字、板书、对话记录、资料预览。</p>' +
      '<p class="muted">已保存到服务端的学习记录、草稿与资料不受影响，下次登录后恢复。最后一次位置保存于 <span class="num">' + S.save.lastOk + '</span>。</p>',
      '<button class="btn" data-act="dlg-close">取消</button><button class="btn btn-ink" data-act="logout-do" autofocus>退出并清除本地内容</button>'));
  };
  App.act['logout-do'] = function () { App.closeDialog(); S.review.loginResult = 'loggedout'; App.go('/login'); };

  App.start = function () {
    window.addEventListener('hashchange', render);
    render();
  };
})();
</script>
<script>/* 1 注册 · 验证 · 待审批 / 登录 · 找回密码 / 2 首页 */
(function () {
  'use strict';
  var A = window.App, S = A.S, ic = A.ic, esc = A.esc;

  function authLeft() {
    return '<aside class="auth-l"><div class="brand"><span class="wm">学伴</span><span class="sub">CS · STUDY</span></div>' +
      '<h1>一个邀请制的计算机学习空间</h1>' +
      '<p>在这里定学习目标、生成路线与课程大纲，然后跟着短步骤的讲解一步步学。首版只对项目成员开放。</p>' +
      '<ol class="how"><li><span class="n">01</span><span><b>提交申请</b> · 邮箱和一句长密码</span></li>' +
      '<li><span class="n">02</span><span><b>验证邮箱</b> · 点开邮件里的链接</span></li>' +
      '<li><span class="n">03</span><span><b>等待审批</b> · 由项目所有者人工处理</span></li>' +
      '<li><span class="n">04</span><span><b>进入学习空间</b> · 两步都完成后才开放</span></li></ol>' +
      '<div class="foot">Chrome / Edge 最新版及上一个大版本</div></aside>';
  }

  /* ================= 注册 ================= */
  var reg = { email: '', pw: '', pw2: '', touched: {}, submitted: false, busy: false, taken: false };

  function pwCheck(v) {
    var n = Array.from(v).length;
    if (!n) return { n: 0, err: '' };
    if (n < 15) return { n: n, err: '密码太短：现在 ' + n + ' 个字符，至少需要 15 个。' };
    if (n > 64) return { n: n, err: '密码太长：现在 ' + n + ' 个字符，最多接受 64 个。' };
    var weak = ['password1234567', '123456789012345', 'qwertyuiopasdfg', 'aaaaaaaaaaaaaaa', 'iloveyouiloveyou'];
    if (weak.indexOf(v.toLowerCase()) >= 0 || /^(.)\1+$/.test(v)) return { n: n, err: '这个密码太常见，或出现在已泄露的密码库里。换一句只有你知道的话。' };
    return { n: n, err: '' };
  }
  function regErrors() {
    var e = {};
    if (!reg.email) e.email = '请填写邮箱。';
    else if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(reg.email)) e.email = '邮箱格式无效：' + (reg.email.indexOf('@') < 0 ? '缺少 @ 符号。' : '@ 后面需要完整的域名，例如 studio.dev。');
    else if (reg.taken) e.email = '这个邮箱已被注册。可以直接登录，或用「找回密码」重设。';
    var p = pwCheck(reg.pw);
    if (!reg.pw) e.pw = '请设置密码。'; else if (p.err) e.pw = p.err;
    if (!reg.pw2) e.pw2 = '请再输入一次密码。'; else if (reg.pw2 !== reg.pw) e.pw2 = '两次输入的密码不一致。';
    return e;
  }
  function ferr(id, msg) { return msg ? '<p class="ferr" id="' + id + '-err">' + ic('alert') + '<span>' + msg + '</span></p>' : ''; }

  function regForm() {
    var e = regErrors(), show = function (k) { return (reg.touched[k] || reg.submitted) ? e[k] : ''; };
    var p = pwCheck(reg.pw), pct = Math.min(100, p.n / 15 * 100);
    var meterCls = p.n > 64 ? 'over' : (p.n >= 15 ? 'ok' : '');
    var meterTxt = !p.n ? '还没输入' : (p.n > 64 ? '已超过 64 个字符' : (p.n >= 15 ? '长度满足：' + p.n + ' 个字符' : '已输入 ' + p.n + ' 个字符 · 还差 ' + (15 - p.n) + ' 个'));
    var keys = Object.keys(e).filter(show);
    var names = { email: '邮箱', pw: '密码', pw2: '确认密码' };
    return '<div class="auth-col"><div class="od-stack" style="--od-gap:6px"><span class="kicker">申请加入</span><h2 class="h1">注册账号</h2>' +
      '<p class="muted">提交后需要先验证邮箱，再由项目所有者人工审批。两步都完成才能使用学习功能。</p></div>' +
      (reg.submitted && keys.length ? '<div class="errsum" role="alert" tabindex="-1" id="errsum"><b>有 ' + keys.length + ' 处需要修改</b><ul>' +
        keys.map(function (k) { return '<li><a href="#" data-act="focus-field" data-f="reg-' + k + '">' + names[k] + '：' + e[k] + '</a></li>'; }).join('') + '</ul></div>' : '') +
      '<form class="od-stack" style="--od-gap:20px" novalidate data-form="reg">' +
      '<div class="field"><label for="reg-email">邮箱</label><input class="inp" id="reg-email" type="email" autocomplete="email" value="' + esc(reg.email) + '"' +
      (show('email') ? ' aria-invalid="true" aria-describedby="reg-email-err"' : '') + ' />' + ferr('reg-email', show('email')) +
      '<p class="help">审批结果也会发到这个邮箱。演示：填 lin.he@studio.dev 会看到「已被注册」。</p></div>' +
      '<div class="field"><label for="reg-pw">密码</label>' +
      '<div class="pw-rule" id="reg-pw-rule"><span>用一句<b>你记得住的长句子</b>，比一串乱码好用。</span>' +
      '<span>长度 <b class="num">15–64</b> 个字符，空格、中文、标点都算。不要求大小写、数字或符号的组合。</span>' +
      '<span class="muted">太常见或出现在已泄露密码库里的密码会被拒绝。</span></div>' +
      '<input class="inp" id="reg-pw" type="password" autocomplete="new-password" value="' + esc(reg.pw) + '" aria-describedby="reg-pw-rule reg-pw-meter' + (show('pw') ? ' reg-pw-err' : '') + '"' + (show('pw') ? ' aria-invalid="true"' : '') + ' />' +
      '<div class="pw-meter ' + meterCls + '" id="reg-pw-meter" aria-live="polite"><div class="bar"><i style="width:' + pct + '%"></i></div><span class="num">' + meterTxt + '</span></div>' + ferr('reg-pw', show('pw')) + '</div>' +
      '<div class="field"><label for="reg-pw2">确认密码</label><input class="inp" id="reg-pw2" type="password" autocomplete="new-password" value="' + esc(reg.pw2) + '"' +
      (show('pw2') ? ' aria-invalid="true" aria-describedby="reg-pw2-err"' : '') + ' />' + ferr('reg-pw2', show('pw2')) + '</div>' +
      '<div class="od-cluster" style="--od-gap:16px"><button class="btn btn-pri" type="submit"' + (reg.busy ? ' disabled' : '') + '>' + (reg.busy ? '<span class="spin"></span>正在提交…' : '提交申请') + '</button>' +
      '<span class="auth-switch">已有账号？<a href="#/login">登录</a></span></div></form></div>';
  }

  function track(state) {
    var steps = [['01', '验证邮箱'], ['02', '等待审批'], ['03', '进入学习空间']];
    var idx = { unverified: 0, pending: 1, approved: 2, rejected: 1, disabled: 2 }[state];
    return '<ol class="track" aria-label="注册进度">' + steps.map(function (s, i) {
      var cls = i < idx ? 'done' : (i === idx ? ((state === 'rejected' || state === 'disabled') ? 'stop' : 'now') : '');
      var lab = i < idx ? '已完成' : (i === idx ? ((state === 'rejected') ? '未获批准' : (state === 'disabled' ? '已停用' : (state === 'approved' ? '可以进入' : '当前这一步'))) : '未开始');
      return '<li class="' + cls + '"' + (i === idx ? ' aria-current="step"' : '') + '><span class="n">' + s[0] + ' · ' + lab + '</span><b>' + s[1] + '</b></li>';
    }).join('') + '</ol>';
  }

  var resendLeft = 0, resendTimer = null, refreshBusy = false, refreshedAt = '';
  function regStatus(state) {
    var email = 'lin.he@studio.dev', masked = 'l***@studio.dev';
    var h = '<div class="auth-col">' + track(state);
    if (state === 'unverified') {
      h += '<div class="wait-hero"><span class="step">第 1 步，共 3 步</span><h2 class="h1">去邮箱点一下验证链接</h2>' +
        '<p class="lede">验证邮件已在 <span class="num">23:12</span> 发到 <b>' + masked + '</b>。点开邮件里的链接，这一步就完成了。</p></div>' +
        '<dl class="facts"><dt>还差</dt><dd>验证邮箱，然后等待审批<span class="sub">验证完成前，申请不会进入审批列表。</span></dd>' +
        '<dt>没收到？</dt><dd>先看垃圾邮件箱，再重发。重发后，以最新一封里的链接为准。</dd></dl>' +
        '<div class="od-cluster" style="--od-gap:12px"><button class="btn btn-pri" data-act="resend"' + (resendLeft ? ' disabled' : '') + '>' + ic('mail') +
        (resendLeft ? '已重发 · <span class="num">' + resendLeft + '</span> 秒后可再次重发' : '重发验证邮件') + '</button>' +
        '<button class="btn btn-quiet" data-act="reg-restart">邮箱填错了，重新申请</button></div>';
    } else if (state === 'pending') {
      h += '<div class="wait-hero"><span class="step">第 2 步，共 3 步</span><h2 class="h1">邮箱已验证，正在等项目所有者审批</h2>' +
        '<p class="lede">你现在什么都不用做。可以关掉这个页面，审批结果会发邮件通知你；也可以随时回来这里，或者用这个邮箱登录，查看进度。</p></div>' +
        '<dl class="facts"><dt>已完成</dt><dd>提交申请、验证邮箱<span class="sub">' + masked + ' · 已验证</span></dd>' +
        '<dt>还差</dt><dd>一次人工审批：批准后就能进入学习空间</dd>' +
        '<dt>等谁</dt><dd>项目所有者<span class="sub">这个空间唯一的审批人，人工处理，没有固定时限。</span></dd>' +
        '<dt>结果</dt><dd>批准或拒绝，都会发一封邮件到 ' + masked + '</dd></dl>' +
        '<div><span class="kicker">记录</span><ol class="log" style="margin-top:8px"><li><span class="t">09-25 21:12</span><i class="m"></i><span>提交注册申请</span></li>' +
        '<li><span class="t">09-25 21:15</span><i class="m"></i><span>邮箱验证完成</span></li>' +
        '<li class="pend"><span class="t">现在</span><i class="m"></i><span>等待审批 · 已等待约 2 小时 40 分</span></li></ol></div>' +
        '<div class="od-cluster" style="--od-gap:12px"><button class="btn" data-act="reg-refresh"' + (refreshBusy ? ' disabled' : '') + '>' +
        (refreshBusy ? '<span class="spin"></span>正在查询…' : ic('refresh') + '查看最新状态') + '</button>' +
        (refreshedAt ? '<span class="meta" role="status">仍在等待审批 · 查询于 ' + refreshedAt + '</span>' : '') + '</div>';
    } else if (state === 'approved') {
      h += '<div class="wait-hero"><span class="step" style="color:var(--ok)">三步都已完成</span><h2 class="h1">审批通过，可以进入学习空间了</h2>' +
        '<p class="lede">项目所有者在 <span class="num">09-26 09:02</span> 批准了你的申请，通知邮件也已发到 ' + masked + '。</p></div>' +
        '<div><a class="btn btn-pri" href="#/home">进入学习空间 ' + ic('chev') + '</a></div>';
    } else if (state === 'rejected') {
      h += A.note('dark', '已终止', '这个申请没有获得批准', '这个账号不能进入学习空间。如果你认为是误会，请直接联系项目所有者。结果邮件已发到 ' + masked + '。') +
        '<dl class="facts"><dt>处理时间</dt><dd class="num">09-26 09:02</dd><dt>能做什么</dt><dd>这个账号不能登录学习空间，也不能再提交学习任务。</dd></dl>';
    } else if (state === 'disabled') {
      h += A.note('dark', '已停用', '这个账号已被停用', '停用后不能进入学习空间。需要恢复的话，请联系项目所有者。通知邮件已发到 ' + masked + '。') +
        '<dl class="facts"><dt>停用时间</dt><dd class="num">09-24 18:30</dd><dt>你的内容</dt><dd>停用不会让已删除的内容恢复，也不会把内容公开给任何人。</dd></dl>';
    }
    return h + '<p class="auth-switch">这不是你的邮箱 ' + esc(email) + '？<a href="#/login">换个账号登录</a></p></div>';
  }

  A.route('/register', {
    bare: true, title: '注册与审批',
    render: function () {
      var st = S.review.authStep;
      return '<div class="auth">' + authLeft() + '<div class="auth-r">' + (st === 'form' ? regForm() : regStatus(st)) + '</div></div>';
    },
    mount: function (root) {
      A.onLeave(function () { clearInterval(resendTimer); });
      var f = root.querySelector('[data-form="reg"]');
      if (!f) return;
      function repaint(focusId) {
        var pos = document.activeElement && document.activeElement.selectionStart;
        A.render(); var el = document.getElementById(focusId);
        if (el) { el.focus(); try { el.setSelectionRange(pos, pos); } catch (e) {} }
      }
      f.addEventListener('input', function (e) {
        var id = e.target.id;
        if (id === 'reg-email') { reg.email = e.target.value; reg.taken = false; }
        if (id === 'reg-pw') { reg.pw = e.target.value; repaint(id); return; }
        if (id === 'reg-pw2') reg.pw2 = e.target.value;
      });
      f.addEventListener('focusout', function (e) {
        var k = { 'reg-email': 'email', 'reg-pw': 'pw', 'reg-pw2': 'pw2' }[e.target.id];
        if (!k) return;
        reg.touched[k] = true;
        // 焦点移向按钮或链接时不重绘，避免吞掉那次点击
        if (e.relatedTarget && e.relatedTarget.tagName !== 'INPUT') return;
        var next = e.relatedTarget && e.relatedTarget.id;
        setTimeout(function () { repaint(next || ''); }, 0);
      });
      f.addEventListener('submit', function (e) {
        e.preventDefault();
        reg.submitted = true;
        if (reg.email.toLowerCase() === 'lin.he@studio.dev') reg.taken = true;
        var errs = regErrors();
        if (Object.keys(errs).length) { A.render(); var s = document.getElementById('errsum'); if (s) s.focus(); return; }
        reg.busy = true; A.render();
        setTimeout(function () { reg.busy = false; S.review.authStep = 'unverified'; A.render(); }, 900);
      });
    }
  });
  A.act['focus-field'] = function (el, e) { e.preventDefault(); var t = document.getElementById(el.getAttribute('data-f')); if (t) t.focus(); };
  A.act['resend'] = function () {
    resendLeft = 60; A.toast('验证邮件已重发到 l***@studio.dev，之前的链接失效。'); A.render();
    clearInterval(resendTimer);
    resendTimer = setInterval(function () {
      resendLeft--; var b = document.querySelector('[data-act="resend"]');
      if (resendLeft <= 0) { clearInterval(resendTimer); resendLeft = 0; A.render(); return; }
      if (b) b.innerHTML = ic('mail') + '已重发 · <span class="num">' + resendLeft + '</span> 秒后可再次重发';
    }, 1000);
  };
  A.act['reg-restart'] = function () { S.review.authStep = 'form'; reg = { email: '', pw: '', pw2: '', touched: {}, submitted: false }; A.render(); };
  A.act['reg-refresh'] = function () {
    refreshBusy = true; A.render();
    setTimeout(function () { refreshBusy = false; refreshedAt = A.clock(); A.render(); }, 800);
  };

  /* ================= 登录 · 找回密码 ================= */
  var lg = { view: 'login', busy: false, email: 'lin.he@studio.dev' };
  function loginNotice() {
    var r = S.review.loginResult;
    if (r === 'expired') return A.note('warn', '会话过期', '会话已过期，请重新登录', '你已保存的学习记录不受影响：最后一次位置保存于 <span class="num">23:41:07</span>，服务端已确认。登录后回到 L-3.2「超时重传与 RTT 估计」。');
    if (r === 'loggedout') return A.note('ok', '已退出', '你已退出登录', '这台电脑上缓存的学习内容已清除。服务端的记录不受影响。');
    return '';
  }
  function loginResultBlock() {
    var r = S.review.loginResult;
    if (r === 'wrong') return '';
    if (r === 'locked') return A.note('err', '已暂停', '登录暂时停用 15 分钟', '同一账号 15 分钟内连续失败 5 次。<span class="num">00:07</span> 后自动恢复，不需要联系任何人。等不及的话，可以先重设密码。', '<button class="btn btn-sm" data-act="lg-forgot">重设密码</button>');
    if (r === 'unverified') return A.note('accent', '还差一步', '账号还没有验证邮箱', '密码正确。这不是错误——去邮箱点一下验证链接，申请才会进入审批。验证邮件发到 l***@studio.dev。', '<a class="btn btn-sm" href="#/register" data-act="to-reg" data-s="unverified">查看注册进度</a><button class="btn btn-sm" data-act="resend-lg">重发验证邮件</button>');
    if (r === 'pending') return A.note('accent', '第 2 步', '邮箱已验证，正在等项目所有者审批', '密码正确。这不是错误，你不需要做任何事。审批结果会发邮件通知你。', '<a class="btn btn-sm" href="#/register" data-act="to-reg" data-s="pending">查看审批进度</a>');
    if (r === 'rejected') return A.note('dark', '已终止', '这个账号的申请没有获得批准', '不能进入学习空间。如有疑问，请直接联系项目所有者。');
    if (r === 'disabled') return A.note('dark', '已停用', '这个账号已被停用', '不能进入学习空间。需要恢复的话，请联系项目所有者。');
    return '';
  }
  function loginView() {
    var r = S.review.loginResult, wrong = r === 'wrong';
    return '<div class="auth-col"><div class="od-stack" style="--od-gap:6px"><span class="kicker">登录</span><h2 class="h1">回到你的学习空间</h2></div>' + loginNotice() +
      '<form class="od-stack" style="--od-gap:20px" data-form="login" novalidate>' +
      '<div class="field"><label for="lg-email">邮箱</label><input class="inp" id="lg-email" type="email" autocomplete="username" value="' + esc(lg.email) + '" /></div>' +
      '<div class="field"><div class="od-row" style="justify-content:space-between"><label for="lg-pw">密码</label><button type="button" class="linkbtn" data-act="lg-forgot" style="font-size:13px">忘记密码</button></div>' +
      '<input class="inp" id="lg-pw" type="password" autocomplete="current-password"' + (wrong ? ' aria-invalid="true" aria-describedby="lg-err"' : '') + ' />' +
      (wrong ? ferr('lg', '邮箱或密码不正确。为了不暴露账号是否存在，这里不会说明是哪一项。15 分钟内连续失败 5 次会暂停登录 15 分钟。') : '') + '</div>' +
      loginResultBlock() +
      '<div class="od-cluster" style="--od-gap:16px"><button class="btn btn-pri" type="submit"' + (lg.busy ? ' disabled' : '') + '>' + (lg.busy ? '<span class="spin"></span>正在登录…' : '登录') + '</button>' +
      '<span class="auth-switch">还没有账号？<a href="#/register" data-act="to-reg" data-s="form">申请加入</a></span></div></form>' +
      '<p class="meta">演示：填写邮箱和密码后点击登录。</p></div>';
  }
  function forgotView() {
    if (lg.view === 'forgot') return '<div class="auth-col"><div class="od-stack" style="--od-gap:6px"><span class="kicker">找回密码</span><h2 class="h1">通过邮件重设密码</h2>' +
      '<p class="muted">输入注册邮箱，我们会发一个重设链接。链接 30 分钟内有效，用过一次就失效。</p></div>' +

  A.act['cloud-save'] = function (el) { var k = el.getAttribute('data-kind'); if (endpointError(k + '-endpoint', false)) return; var d = U.cloud[k] = U.cloud[k] || {}; d.endpoint = val(k + '-endpoint'); d.privacy = val(k + '-privacy'); d.retention = val(k + '-retention'); document.getElementById(k + '-secret').value = ''; A.save.touch(); A.toast('已保存 ' + k + ' 草稿；凭据已丢弃。'); A.render(); };
  A.act['cloud-toggle'] = function (el) { var k = el.getAttribute('data-kind'), d = U.cloud[k] || {}; if (S.review[k] === 'ok') { A.dialog(A.dlgShell('停用确认 · 演示', '停用 ' + k + '？', '<p>停用后不会发起新的调用，已经保存的用户内容保留；依赖该能力的处理会暂停或进入降级状态。</p>', '<button class="btn" data-act="dlg-close">取消</button><button class="btn btn-danger" data-act="cloud-toggle-off" data-kind="' + k + '">确认停用</button>')); return; } if (!d.endpoint || !d.privacy || !d.retention) { A.toast('不能启用：先保存接口地址、隐私说明和数据保留信息，不能使用默认条款。', true); return; } A.dialog(A.dlgShell('启用确认 · 演示', '启用 ' + k + '？', '<p>启用只改变当前演示状态。测试仍使用非私人样例，不代表真实服务可用。</p>', '<button class="btn" data-act="dlg-close">取消</button><button class="btn btn-pri" data-act="cloud-toggle-ok" data-kind="' + k + '">确认启用</button>')); };
  A.act['cloud-toggle-off'] = function (el) { var k = el.getAttribute('data-kind'); if (k !== 'ocr' && k !== 'search') return; S.review[k] = k === 'ocr' ? 'down' : 'timeout'; A.closeDialog(); A.toast(k + ' 已在演示状态中停用，已有内容保留。'); A.render(); };
  A.act['cloud-toggle-ok'] = function (el) { var k = el.getAttribute('data-kind'); S.review[k] = 'ok'; A.closeDialog(); A.toast(k + ' 已在演示状态中启用。'); A.render(); };
  A.act['cloud-apply'] = function () { var missing = ['ocr', 'search'].filter(function (k) { var d = U.cloud[k] || {}; return !d.endpoint || !d.privacy || !d.retention; }); if (missing.length) { A.toast('不能启用：请先为 ' + missing.join('、') + ' 填写接口地址、隐私说明和数据保留信息。', true); return; } A.dialog(A.dlgShell('应用确认 · 演示', '启用云能力？', '<p>将更新 OCR 和搜索的演示状态，不会发起请求，不会删除内容。正式环境仍需服务商条款核对。</p>', '<button class="btn" data-act="dlg-close">取消</button><button class="btn btn-pri" data-act="cloud-apply-ok" autofocus>确认应用</button>')); };
  A.act['cloud-apply-ok'] = function () { S.review.ocr = 'ok'; S.review.search = 'ok'; A.closeDialog(); A.toast('云能力已在演示状态中启用。'); A.render(); };
  document.addEventListener('change', function (e) { if (e.target && e.target.classList.contains('admin-filter')) { U.filter = e.target.value; A.render(); } });
})();
</script>
<script>App.start();</script>
</body>
</html>
